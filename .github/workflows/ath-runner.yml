name: ATH runner
# The GitHub Actions lane of the ath_ops queue (Spaidbot / ATHOS own workers, $0, runs with every Mac off).
# Auth: GitHub OIDC (audience "ath-runner") verified by the Supabase Edge Function ath-runner. No stored secret anywhere.
# Budget: this repo is PUBLIC (2026-11-12: standard runners are free and unmetered for public repos). It must never hold a
# secret, private footage or personal data: private inputs (e.g. the commercials kit zip) come through the gate at run time.
# The tools and the work only run when a job is waiting.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ath-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check in (exits at once when the queue is empty)
        id: q
        run: node runner/ath-runner.mjs --peek
      - name: Tools (ffmpeg, page capture, free voice)
        if: steps.q.outputs.waiting != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core fonts-lato zip unzip tesseract-ocr > /dev/null
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci --no-audit --no-fund --ignore-scripts
          python3 -m pip install --quiet --user piper-tts==1.8.0 kokoro-onnx==0.4.7 soundfile pillow
          mkdir -p ~/.piper && cd ~/.piper
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium
          curl -fsSL -o en_US-lessac-medium.onnx "$base.onnx" && curl -fsSL -o en_US-lessac-medium.onnx.json "$base.onnx.json"
          echo "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f  en_US-lessac-medium.onnx" | sha256sum -c - || rm -f en_US-lessac-medium.onnx
          ffmpeg -hide_banner -filters 2>/dev/null | grep -E " (drawtext|ssim|zoompan) " | awk '{print $2}' | tr '\n' ' '; echo
      - name: Kokoro voice model cache (commercial spots)
        if: steps.q.outputs.waiting != '0'
        uses: actions/cache@v4
        with:
          path: ~/.kokoro
          key: kokoro-model-files-v1.0
      - name: Kokoro voice model (free, open weights; github.com/thewh1teagle/kokoro-onnx release model-files-v1.0)
        if: steps.q.outputs.waiting != '0'
        run: |
          mkdir -p ~/.kokoro && cd ~/.kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin "$base/voices-v1.0.bin"
          ls -la; tesseract --version | head -1
      - name: Work the queue
        if: steps.q.outputs.waiting != '0'
        env:
          ATH_CHROME: /usr/bin/google-chrome
        run: node runner/ath-runner.mjs --work --minutes 25
